name: Precio de los carburantes

# Descarga los precios de todas las gasolineras del Ministerio y publica el resumen si ha cambiado
# (dato oficial, sin redacción: no necesita revisión). Horas en UTC: 7:15 y 15:15 de España en invierno.
on:
  schedule:
    # GitHub se salta a menudo ejecuciones programadas: se reparten varias al día (solo publica si cambian los precios)
    - cron: "23 5,9,13,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  carburantes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests xlrd openpyxl pandas lxml
      - run: python scripts/carburantes.py
      - name: Publicar si hay cambios
        run: |
          git config user.name "carburantes-bot"
          git config user.email "carburantes-bot@users.noreply.github.com"
          git add src/data/carburantes.json src/data/carburantes-ciudades.json
          if ! git diff --cached --quiet; then
            git commit -m "Carburantes: precios actualizados"
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          fi
      - name: Avisar del fallo por Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_AVISOS_CHAT_ID }}
          URL_EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ] && exit 0
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=❌ Ha fallado el precio de los carburantes de Al Final de Mes: ${URL_EJECUCION}"
