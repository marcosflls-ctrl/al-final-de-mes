name: Probar fuentes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests feedparser
      - run: python scripts/probar_fuentes.py
      # Si la prueba deja archivos en salida_prueba/, se suben a la rama «descargas» para revisarlos
      - name: Subir resultado
        run: |
          [ -d salida_prueba ] || exit 0
          cd salida_prueba && git init -q -b descargas
          git config user.name "probar-bot" && git config user.email "probar-bot@users.noreply.github.com"
          git add . && git commit -qm "Prueba [CF-Pages-Skip]"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" descargas
