name: Probar el IPC

# En una propuesta que cambia scripts/ipc.py: descarga los datos y los guarda en esa misma rama, para revisar
# las páginas con datos reales antes de aceptarla. El commit lleva [skip ci] para no volver a lanzarse.
on:
  pull_request:
    paths: ["scripts/ipc.py"]

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: python scripts/ipc.py
      - name: Guardar en la rama de la propuesta
        run: |
          git config user.name "ipc-bot"
          git config user.email "ipc-bot@users.noreply.github.com"
          git add src/data/ipc.json
          git diff --cached --quiet || { git commit -m "IPC: datos de prueba [skip ci]"; git push; }
