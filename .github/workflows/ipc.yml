name: IPC

# Descarga el IPC del INE (general, grupos y productos) y publica los datos si han cambiado.
# El INE publica a primeros de mes (adelantado) y a mediados (definitivo, por productos). A diario, 9:45 hora de España en invierno.
on:
  schedule:
    - cron: "45 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  ipc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: python scripts/ipc.py
      - name: Publicar si hay cambios
        run: |
          git config user.name "ipc-bot"
          git config user.email "ipc-bot@users.noreply.github.com"
          git add src/data/ipc.json
          if ! git diff --cached --quiet; then
            git commit -m "IPC: datos actualizados"
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          fi
      - name: Avisar del fallo por Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_AVISOS_CHAT_ID }}
          URL_EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ] && exit 0
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=❌ Ha fallado el IPC de Al Final de Mes: ${URL_EJECUCION}"
